project:
  type: website
  output-dir: _site
  resources:
    - CNAME

website:
  title: "Aydin's Workbench"
  description: "Notes and essays from Aydin Sareff-Hibbert on statistical modelling, research software, data work, and open questions."
  site-url: "https://blog.aydins-workbench.com"
  navbar:
    title: "Aydin's Workbench"
    left:
      - text: "Data notes"
        href: index.qmd#posts
      - text: "About"
        href: about.qmd
    right:
      - text: "Main site"
        href: "https://aydins-workbench.com"
      - text: "Distribution playground"
        href: "https://gamlss.aydins-workbench.com"
      - icon: github
        href: "https://github.com/ahibbert"
      - icon: rss
        href: index.xml
  page-footer:
    left: "Aydin's Workbench · Blog"
    center: "Public-interest data, models and software—worked through in public."
    right: "Built with Quarto"
  reader-mode: true
  search: true
  open-graph: true
  twitter-card: true

format:
  html:
    theme: cosmo
    css: styles.css
    toc: true
    code-fold: true
    code-tools: true
    fig-align: center

execute:
  freeze: auto
  warning: false
  message: false
